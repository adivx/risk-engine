[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "riskengine"
version = "0.1.0"
description = "Value-at-Risk & drawdown analytics lab — historical, parametric, and Monte Carlo VaR/CVaR in pure stdlib Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aditya" }]
keywords = ["finance", "quant", "risk", "var", "cvar", "expected-shortfall", "drawdown", "monte-carlo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/adivx/risk-engine"
Repository = "https://github.com/adivx/risk-engine"

[project.scripts]
risk-engine = "riskengine.cli:main"

[tool.setuptools]
packages = ["riskengine"]
